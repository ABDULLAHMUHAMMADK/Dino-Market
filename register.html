<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Dine Market</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="register-card">
        <div class="card-header">
          <h1 class="card-title">Create an account</h1>
          <p class="card-description">
            Enter your information below to create your account
          </p>
        </div>

        <div class="card-content">
          <form class="register-form">
            <div class="field-group">
              <label class="field-label" for="name">Full Name</label>
              <input
                class="field-input"
                id="name"
                type="text"
                placeholder="John Doe"
                required
              />
            </div>

            <div class="field-group">
              <label class="field-label" for="email">Email</label>
              <input
                class="field-input"
                id="email"
                type="email"
                placeholder="m@example.com"
                required
              />
              <p class="field-description-sub">
                We&apos;ll use this to contact you. We will not share your email
                with anyone else.
              </p>
            </div>

            <div class="field-group">
              <label class="field-label" for="password">Password</label>
              <input
                class="field-input"
                id="password"
                type="password"
                required
              />
              <p class="field-description-sub">
                Must be at least 8 characters long.
              </p>
            </div>

            <div class="field-group">
              <label class="field-label" for="confirm-password"
                >Confirm Password</label
              >
              <input
                class="field-input"
                id="confirm-password"
                type="password"
                required
              />
              <p class="field-description-sub">Please confirm your password.</p>
            </div>

            <div class="field-group field-actions">
              <button class="button button-primary" type="submit">
                Create Account
              </button>
              <button class="button button-secondary" type="button">
                Sign up with Google
              </button>
            </div>

            <p class="field-description">
              Already have an account? <a href="login.html">Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
