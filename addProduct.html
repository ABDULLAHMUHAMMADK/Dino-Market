<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ===== ADD PRODUCT FORM ===== */
.add-product-section {
    max-width: 1200px;
    margin: 30px auto;
    padding: 30px 40px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
}

.add-product-section h2 {
    font-size: 24px;
    color: #1a1a1a;
    margin-bottom: 25px;
    font-weight: 600;
}

#productForm {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.form-group input,
.form-group textarea {
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    transition: border-color 0.3s, box-shadow 0.3s;
    background: #fafafa;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
    background: white;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #aaa;
}

/* Make description and submit button span full width */
.form-group:has(textarea) {
    grid-column: 1 / -1;
}

.submit-btn {
    grid-column: 1 / -1;
    background: #2ecc71;
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    margin-top: 10px;
}

.submit-btn:hover {
    background: #27ae60;
    transform: translateY(-2px);
}

.submit-btn:active {
    transform: translateY(0);
}

/* ===== RESPONSIVE FORM ===== */
@media (max-width: 768px) {
    .add-product-section {
        padding: 20px;
        margin: 20px 10px;
    }

    #productForm {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .form-group:has(textarea) {
        grid-column: 1;
    }

    .submit-btn {
        grid-column: 1;
    }

    .add-product-section h2 {
        font-size: 20px;
    }
}
    </style>
</head>
<body>
    <!-- Add Product Form Section -->
<section class="add-product-section">
    <h2>➕ Add New Product</h2>
    <form id="productForm">
        <div class="form-group">
            <label for="productName">Product Name *</label>
            <input type="text" id="productName" placeholder="e.g., Wireless Headphones" required />
        </div>

        <div class="form-group">
            <label for="productCategory">Category</label>
            <input type="text" id="productCategory" placeholder="e.g., Electronics" />
        </div>

        <div class="form-group">
            <label for="productPrice">Price *</label>
            <input type="number" id="productPrice" placeholder="e.g., 99.99" step="0.01" required />
        </div>

        <div class="form-group">
            <label for="productImage">Image URL</label>
            <input type="url" id="productImage" placeholder="https://example.com/image.jpg" />
        </div>

        <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" rows="3" placeholder="Describe your product..."></textarea>
        </div>

        <button type="submit" class="submit-btn">➕ Add Product</button>
    </form>
</section>




<script src="./allProuduct.js"></script>
<script src="./addProduct.js"></script>
</body>
</html>
